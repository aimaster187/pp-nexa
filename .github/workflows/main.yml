name: Build ZED AI 5D Advanced APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Build ZED AI APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Rename APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/ZED-AI-5D-ADVANCED.apk
          sha256sum dist/ZED-AI-5D-ADVANCED.apk
      - name: Upload NEW ZED AI APK
        uses: actions/upload-artifact@v4
        with:
          name: ZED-AI-5D-ADVANCED
          path: dist/ZED-AI-5D-ADVANCED.apk
          if-no-files-found: error
          retention-days: 14
