<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ZED AI — Titan Admin Command Center</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <style>
    body { background: #e8effa; color: #0f172a; font-family: system-ui, -apple-system, sans-serif; }
    .card-4d { background: #f4f8ff; border-radius: 22px; box-shadow: 0 10px 25px rgba(30, 58, 138, 0.10), inset 0 1px 0 #ffffff; }
    .pill-blue { background: linear-gradient(135deg, #3b82f6, #2563eb); color: #ffffff; box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35); }
  </style>
</head>
<body class="min-h-screen p-4 pb-20">
  <div class="max-w-3xl mx-auto space-y-4">
    <div class="card-4d p-4 flex items-center justify-between">
      <div>
        <h1 class="text-xl font-bold text-slate-900">ZED AI — TITAN ADMIN</h1>
        <p class="text-xs text-blue-600 font-medium">by The Titan AI • Live Cloud Control (Pranav Patel)</p>
      </div>
      <span id="syncBadge" class="px-3 py-1 rounded-full text-xs font-bold bg-emerald-100 text-emerald-700">● LIVE FIRESTORE</span>
    </div>

    <div class="grid grid-cols-4 gap-2 text-center">
      <div class="card-4d p-3">
        <div id="statUsers" class="text-xl font-bold text-slate-900">0</div>
        <div class="text-[11px] text-slate-500">APP USERS</div>
      </div>
      <div class="card-4d p-3">
        <div id="statVip" class="text-xl font-bold text-emerald-600">0</div>
        <div class="text-[11px] text-slate-500">VIP ACTIVE</div>
      </div>
      <div class="card-4d p-3">
        <div id="statUnused" class="text-xl font-bold text-blue-600">0</div>
        <div class="text-[11px] text-slate-500">UNUSED KEYS</div>
      </div>
      <div class="card-4d p-3">
        <div id="statBanned" class="text-xl font-bold text-rose-600">0</div>
        <div class="text-[11px] text-slate-500">BANNED</div>
      </div>
    </div>

    <div class="card-4d p-4 space-y-3">
      <h2 class="text-sm font-bold text-slate-800 uppercase">Generate New VIP License Key</h2>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
        <input id="clientInput" type="text" placeholder="Client Name (e.g. Pranav VIP)" class="px-3 py-2.5 rounded-xl bg-white border border-slate-200 text-sm outline-none" />
        <select id="daysSelect" class="px-3 py-2.5 rounded-xl bg-white border border-slate-200 text-sm outline-none">
          <option value="1">1 Day Trial</option>
          <option value="7">7 Days VIP</option>
          <option value="30" selected>30 Days (1 Month VIP)</option>
          <option value="365">365 Days (1 Year VIP)</option>
          <option value="0">Lifetime Unlimited</option>
        </select>
        <button onclick="forgeKey()" class="pill-blue py-2.5 px-4 rounded-xl font-bold text-sm active:scale-95 transition">+ GENERATE KEY</button>
      </div>
    </div>

    <div class="flex gap-2">
      <button id="tabKeysBtn" onclick="switchTab('keys')" class="pill-blue flex-1 py-2.5 rounded-xl text-xs font-bold">VIP KEYS</button>
      <button id="tabUsersBtn" onclick="switchTab('users')" class="card-4d flex-1 py-2.5 rounded-xl text-xs font-bold text-slate-700">APP USERS (GOOGLE / SIGNUP)</button>
    </div>

    <input id="searchBox" oninput="renderLists()" type="text" placeholder="Search Name, Email, Key, Device..." class="w-full px-4 py-3 rounded-2xl bg-white shadow-sm text-sm outline-none" />

    <div id="keysContainer" class="space-y-2.5"></div>
    <div id="usersContainer" class="space-y-2.5 hidden"></div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAoIkiPgmcOknwn0HAjVkTSjkbMA_YvZak",
      authDomain: "gen-lang-client-0039144139.firebaseapp.com",
      projectId: "gen-lang-client-0039144139",
      storageBucket: "gen-lang-client-0039144139.firebasestorage.app",
      messagingSenderId: "788118554337",
      appId: "1:788118554337:android:3a0b137e7ec01dfdf319a0"
    };
    const app = firebase.apps.length ? firebase.app() : firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore(app, "ai-studio-android-nexaai-74a37412-09eb-422f-8076-ca2691f1d973");

    let allKeys = JSON.parse(localStorage.getItem("zed_cache_keys") || "[]");
    let allUsers = JSON.parse(localStorage.getItem("zed_cache_users") || "[]");
    let currentTab = "keys";

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById("keysContainer").classList.toggle("hidden", tab !== "keys");
      document.getElementById("usersContainer").classList.toggle("hidden", tab !== "users");
      document.getElementById("tabKeysBtn").className = tab === "keys" ? "pill-blue flex-1 py-2.5 rounded-xl text-xs font-bold" : "card-4d flex-1 py-2.5 rounded-xl text-xs font-bold text-slate-700";
      document.getElementById("tabUsersBtn").className = tab === "users" ? "pill-blue flex-1 py-2.5 rounded-xl text-xs font-bold" : "card-4d flex-1 py-2.5 rounded-xl text-xs font-bold text-slate-700";
    }

    function randomBlock() {
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      return Array.from({length: 4}, () => chars[Math.floor(Math.random() * chars.length)]).join("");
    }

    async function forgeKey() {
      const clientName = document.getElementById("clientInput").value.trim() || "VIP Client";
      const days = parseInt(document.getElementById("daysSelect").value, 10);
      const key = `ZED-VIP-${randomBlock()}-${randomBlock()}`;
      const now = Date.now();
      const expiresAt = days > 0 ? now + days * 86400000 : 0;

      const data = {
        key,
        clientName,
        status: "active",
        createdAt: now,
        expiresAt,
        deviceId: "",
        deviceModel: ""
      };
      await db.collection("zed_licenses").doc(key).set(data);
      document.getElementById("clientInput").value = "";
    }

    async function toggleBanKey(key, curStatus) {
      const next = curStatus === "banned" ? "active" : "banned";
      await db.collection("zed_licenses").doc(key).update({ status: next });
    }

    async function deleteKey(key) {
      await db.collection("zed_licenses").doc(key).delete();
    }

    async function toggleBanUser(uid, curBanned) {
      await db.collection("zed_users").doc(uid).update({ banned: !curBanned });
    }

    async function grantFreeVipToUser(uid, name) {
      const key = `ZED-VIP-${randomBlock()}-${randomBlock()}`;
      await db.collection("zed_licenses").doc(key).set({
        key, clientName: name, status: "used", createdAt: Date.now(), expiresAt: 0, deviceId: ""
      });
      await db.collection("zed_users").doc(uid).update({ isVip: true, grantedVipKey: key, activeKey: key });
      alert("Granted Lifetime VIP Key: " + key);
    }

    function updateStats() {
      document.getElementById("statUsers").innerText = allUsers.length;
      document.getElementById("statVip").innerText = allKeys.filter(k => k.status === "used").length;
      document.getElementById("statUnused").innerText = allKeys.filter(k => k.status === "active").length;
      document.getElementById("statBanned").innerText = allKeys.filter(k => k.status === "banned").length + allUsers.filter(u => u.banned).length;
    }

    function renderLists() {
      const q = document.getElementById("searchBox").value.trim().toLowerCase();
      updateStats();

      const kHtml = allKeys
        .filter(k => !q || (k.key + k.clientName + (k.activatedByEmail || "")).toLowerCase().includes(q))
        .map(k => {
          const validTxt = k.expiresAt > 0 ? new Date(k.expiresAt).toLocaleDateString() : "Lifetime";
          const badge = k.status === "banned" ? "bg-rose-100 text-rose-700" : (k.status === "used" ? "bg-emerald-100 text-emerald-700" : "bg-blue-100 text-blue-700");
          return `<div class="card-4d p-4 space-y-2">
            <div class="flex items-center justify-between">
              <span class="font-mono font-bold text-base text-slate-900">${k.key}</span>
              <span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold uppercase ${badge}">${k.status}</span>
            </div>
            <div class="text-xs text-slate-600">Client: <b>${k.clientName}</b> • Validity: <b>${validTxt}</b> ${k.activatedByEmail ? "• User: " + k.activatedByEmail : ""}</div>
            <div class="flex gap-2 pt-1">
              <button onclick="navigator.clipboard.writeText('${k.key}')" class="px-3 py-1.5 rounded-xl bg-white text-slate-800 text-xs font-bold shadow-sm">COPY</button>
              <button onclick="toggleBanKey('${k.key}', '${k.status}')" class="px-3 py-1.5 rounded-xl bg-rose-500 text-white text-xs font-bold">${k.status === "banned" ? "UNBAN" : "BAN"}</button>
              <button onclick="deleteKey('${k.key}')" class="px-3 py-1.5 rounded-xl bg-slate-200 text-slate-700 text-xs font-bold">DEL</button>
            </div>
          </div>`;
        }).join("");
      document.getElementById("keysContainer").innerHTML = kHtml || `<div class="card-4d p-4 text-center text-xs text-slate-500">No keys found.</div>`;

      const uHtml = allUsers
        .filter(u => !q || ((u.name || "") + (u.email || "") + (u.deviceModel || "")).toLowerCase().includes(q))
        .map(u => `<div class="card-4d p-4 space-y-2">
          <div class="flex items-center justify-between">
            <div>
              <div class="font-bold text-sm text-slate-900">${u.name || "User"}</div>
              <div class="text-xs text-blue-600">${u.email || ""} (${u.provider || "Google"})</div>
            </div>
            <span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold ${u.banned ? "bg-rose-100 text-rose-700" : (u.isVip ? "bg-emerald-100 text-emerald-700" : "bg-amber-100 text-amber-700")}">
              ${u.banned ? "BANNED" : (u.isVip ? "VIP UNLOCKED" : "FREE 10M")}
            </span>
          </div>
          <div class="text-[11px] text-slate-500">Device: ${u.deviceModel || "Android"} • Key: ${u.activeKey || "None"}</div>
          <div class="flex gap-2 pt-1">
            <button onclick="grantFreeVipToUser('${u.uid}', '${(u.name || "User").replace(/'/g, "")}')" class="px-3 py-1.5 rounded-xl pill-blue text-xs font-bold">GIVE LIFETIME VIP</button>
            <button onclick="toggleBanUser('${u.uid}', ${!!u.banned})" class="px-3 py-1.5 rounded-xl bg-rose-500 text-white text-xs font-bold">${u.banned ? "UNBAN USER" : "BAN USER"}</button>
          </div>
        </div>`).join("");
      document.getElementById("usersContainer").innerHTML = uHtml || `<div class="card-4d p-4 text-center text-xs text-slate-500">No app users signed up yet.</div>`;
    }

    renderLists();

    db.collection("zed_licenses").orderBy("createdAt", "desc").onSnapshot(snap => {
      allKeys = snap.docs.map(d => d.data());
      localStorage.setItem("zed_cache_keys", JSON.stringify(allKeys));
      renderLists();
    });

    db.collection("zed_users").orderBy("lastActiveAt", "desc").onSnapshot(snap => {
      allUsers = snap.docs.map(d => d.data());
      localStorage.setItem("zed_cache_users", JSON.stringify(allUsers));
      renderLists();
    });
  </script>
</body>
</html>
