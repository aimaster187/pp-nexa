    :root {
      --cyan: #00f0ff;
      --violet: #8b5cf6;
      --emerald: #00ff9d;
      --rose: #ff2a6d;

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

      font-family: 'Rajdhani', sans-serif;
      overflow-x: hidden;
      
    }

      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* 5D Holographic Glass Slab */
    .card-5d {
      position: relative;
      background: linear-gradient(145deg, rgba(14, 22, 42, 0.86), rgba(6, 10, 22, 0.94));
      border: 1px solid rgba(0, 240, 255, 0.35);
      border-top: 1.5px solid rgba(255, 255, 255, 0.35);
      border-left: 1.5px solid rgba(0, 240, 255, 0.45);
      border-radius: 24px;

        0 18px 40px -10px rgba(0, 0, 0, 0.85),
        0 0 25px rgba(0, 240, 255, 0.12),
        inset 0 1px 1px rgba(255, 255, 255, 0.18);
      backdrop-filter: none;
      transform-style: preserve-3d;
      transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.25s ease;
    }
    .card-5d::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 24px;
      background: linear-gradient(125deg, rgba(255,255,255,0.12) 0%, transparent 40%, rgba(0,240,255,0.08) 100%);
      pointer-events: none;
    }

    /* Real Tactile 3D Mechanical Push Buttons */
    .btn-3d {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      letter-spacing: 0.05em;
      border-radius: 16px;
      transform: translateY(0px);
      transition: transform 0.08s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.08s ease, filter 0.15s ease;
      cursor: pointer;
      user-select: none;
    }
    .btn-3d-cyan {
      background: linear-gradient(180deg, #22f5ff 0%, #00b8d4 100%);
      color: #020813;
      border-top: 2px solid #b8ffff;
      box-shadow:
        0 6px 0 #006073,
        0 12px 24px rgba(0, 240, 255, 0.45);
    }
    .btn-3d-cyan:active {
      transform: translateY(5px);
      box-shadow:
        0 1px 0 #006073,
        0 4px 10px rgba(0, 240, 255, 0.35);
    }

    .btn-3d-emerald {
      background: linear-gradient(180deg, #34ffab 0%, #00c476 100%);
      color: #02120a;
      border-top: 2px solid #c4ffe6;
      box-shadow:
        0 6px 0 #00663d,
        0 12px 24px rgba(0, 255, 157, 0.4);
    }
    .btn-3d-emerald:active {
      transform: translateY(5px);
      box-shadow:
        0 1px 0 #00663d,
        0 4px 10px rgba(0, 255, 157, 0.3);
    }

    .btn-3d-rose {
      background: linear-gradient(180deg, #ff5286 0%, #d81b54 100%);
      color: #ffffff;
      border-top: 2px solid #ffb3c9;
      box-shadow:
        0 5px 0 #75092a,
        0 10px 20px rgba(255, 42, 109, 0.4);

    .btn-3d-rose:active {
      transform: translateY(4px);
      box-shadow:
        0 1px 0 #75092a,
        0 3px 8px rgba(255, 42, 109, 0.3);
    }

    .btn-3d-dark {
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
      color: #e2e8f0;
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-top: 1.5px solid rgba(255, 255, 255, 0.25);
      box-shadow:
        0 5px 0 #020617,

      transform: translateY(4px);
      box-shadow:
        0 1px 0 #020617,
        0 3px 8px rgba(0, 0, 0, 0.5);
    }

    /* Recessed 3D Input Wells */
    .input-3d {
      background: rgba(2, 6, 18, 0.9);
      border: 1px solid rgba(0, 240, 255, 0.28);
      border-radius: 16px;
      color: #fff;

    .input-3d:focus {

      border-color: var(--cyan);
      box-shadow: inset 0 4px 10px rgba(0, 0, 0, 0.85), 0 0 16px rgba(0, 240, 255, 0.35);
    }

    /* Hologram Scanline */
    .scanline {
      position: fixed;
      top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, transparent, var(--cyan), var(--violet), transparent);
      box-shadow: 0 0 18px var(--cyan);
      animation: scanMove 5s linear infinite;
      z-index: 50;
      pointer-events: none;
    }
    @keyframes scanMove {
      0% { top: 0%; opacity: 0.2; }
      50% { opacity: 0.9; }
      100% { top: 100%; opacity: 0.2; }
    }
  </style>
</head>

  <script>
    // === TACTILE 3D MECHANICAL SOUND & HAPTIC ENGINE ===
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    window.playClick = () => {
      try {
        if (navigator.vibrate) navigator.vibrate(18);
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(520, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(110, audioCtx.currentTime + 0.055);
        gain.gain.setValueAtTime(0.22, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.055);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.06);
      } catch (e) {}
    };

    // === 3D INTERACTIVE HOLOGRAPHIC SPHERE & MATRIX BACKGROUND ===
    const canvas = document.getElementById('holoCanvas');
    const ctx = canvas.getContext('2d');
    let w, h, rotY = 0, rotX = 0.25, tiltX = 0, tiltY = 0;

    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    window.addEventListener('deviceorientation', (e) => {
      if (e.gamma !== null && e.beta !== null) {
        tiltY = (e.gamma / 45) * 0.4;
        tiltX = ((e.beta - 45) / 45) * 0.4;
      }
    });

    const nodes = [];
    for (let i = 0; i < 65; i++) {
      const phi = Math.acos(-1 + (2 * i) / 65);
      const theta = Math.sqrt(65 * Math.PI) * phi;
      nodes.push({
        x: Math.cos(theta) * Math.sin(phi),
        y: Math.sin(theta) * Math.sin(phi),
        z: Math.cos(phi)
      });
    }

    function drawHolo() {
      ctx.clearRect(0, 0, w, h);
      rotY += 0.0045;
      const cx = w * 0.5 + tiltY * 60;
      const cy = h * 0.36 + tiltX * 60;
      const radius = Math.min(w, h) * 0.34;

      const proj = nodes.map(n => {
        const x1 = n.x * Math.cos(rotY) - n.z * Math.sin(rotY);
        const z1 = n.z * Math.cos(rotY) + n.x * Math.sin(rotY);
        const y2 = n.y * Math.cos(rotX + tiltX) - z1 * Math.sin(rotX + tiltX);
        const z2 = z1 * Math.cos(rotX + tiltX) + n.y * Math.sin(rotX + tiltX);
        const scale = 320 / (320 + z2 * 140);
        return { px: cx + x1 * radius * scale, py: cy + y2 * radius * scale, z: z2, scale };
      });

      for (let i = 0; i < proj.length; i++) {
        for (let j = i + 1; j < proj.length; j++) {
          const dx = proj[i].px - proj[j].px;
          const dy = proj[i].py - proj[j].py;
          const dist = Math.hypot(dx, dy);
          if (dist < radius * 0.46) {
            ctx.strokeStyle = `rgba(0, 240, 255, ${(1 - dist / (radius * 0.46)) * 0.22})`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(proj[i].px, proj[i].py);
            ctx.lineTo(proj[j].px, proj[j].py);
            ctx.stroke();
          }
        }
      }

      proj.forEach(p => {
        ctx.fillStyle = p.z > 0 ? 'rgba(139, 92, 246, 0.65)' : 'rgba(0, 240, 255, 0.9)';
        ctx.beginPath();
        ctx.arc(p.px, p.py, 2.4 * p.scale, 0, Math.PI * 2);
        ctx.fill();
      });

      requestAnimationFrame(drawHolo);
    }
    drawHolo();
  </script>

                <div class="flex flex-wrap items-center gap-2.5">
                  <span class="font-mono font-bold text-white text-lg tracking-wider">${k.key}</span>
                  ${badge}
                </div>
                <p class="text-sm text-slate-300">Client: <b class="text-white">${k.label || "-"}</b> • Validity: <b class="text-cyan-300">${expText}</b></p>
                ${isBound ? `<p class="text-xs text-emerald-300">User: <b>${k.boundUserName || "-"}</b> • Phone: <b>${k.boundUserPhone || "N/A"}</b> • ${k.boundUserEmail || ""} • Device: ${k.boundDeviceModel || k.boundDeviceId}</p>` : ""}
              </div>
              <div class="flex flex-wrap gap-2.5">
                <button onclick="playClick(); navigator.clipboard.writeText('${k.key}'); alert('Copied!')" class="btn-3d btn-3d-dark px-3.5 py-2 text-[11px]">COPY</button>
                ${isBound ? `<button onclick="playClick(); unlinkDevice('${k.key}')" class="btn-3d btn-3d-cyan px-3.5 py-2 text-[11px]">UNLINK PHONE</button>` : ""}
                <button onclick="playClick(); toggleKeyBan('${k.key}', ${!!k.isBanned})" class="btn-3d btn-3d-rose px-3.5 py-2 text-[11px]">${k.isBanned ? "UNBAN" : "BAN"}</button>
                <button onclick="playClick(); deleteKey('${k.key}')" class="btn-3d btn-3d-dark px-3.5 py-2 text-[11px] text-rose-400">DEL</button>
              </div>
            </div>
          `;
        });

      const usersHtml = cachedUsers
        .filter(u => JSON.stringify(u).toLowerCase().includes(q))
        .map(u => {
          const cleanPhone = (u.phone || "").replace(/[^0-9]/g, "");
          return `
            <div class="card-5d p-5 flex flex-wrap items-center justify-between gap-4">
              <div class="space-y-1.5">
                <div class="flex items-center gap-2.5">
                  <span class="font-bold text-lg text-white">${u.name || "Unnamed User"}</span>
                  ${u.isBanned
                    ? `<span class="px-2.5 py-0.5 rounded-lg bg-rose-500/20 border border-rose-400/40 text-rose-300 font-cyber text-[10px]">BANNED</span>`
                    : `<span class="px-2.5 py-0.5 rounded-lg bg-emerald-500/20 border border-emerald-400/40 text-emerald-300 font-cyber text-[10px]">VERIFIED</span>`}
                </div>
                <p class="text-sm text-cyan-300">Phone: <b class="text-white">${u.phone || "Not Added"}</b> • Email: <b class="text-white">${u.email || "-"}</b></p>
                <p class="text-xs text-slate-400">Device: ${u.deviceModel || "-"} • Key: <span class="font-mono text-amber-300">${u.vipKey || "FREE PLAN"}</span></p>
              </div>
              <div class="flex gap-2.5">
                ${cleanPhone ? `<a onclick="playClick()" href="https://wa.me/${cleanPhone}" target="_blank" class="btn-3d btn-3d-emerald px-4 py-2 text-[11px]">WHATSAPP</a>` : ""}
                <button onclick="playClick(); toggleUserBan('${u.uid}', ${!!u.isBanned})" class="btn-3d btn-3d-rose px-4 py-2 text-[11px]">${u.isBanned ? "UNBAN USER" : "BAN USER"}</button>
              </div>
            </div>
          `;
        });

      document.getElementById("keysSection").innerHTML = keysHtml.length ? keysHtml.join("") : `<div class="card-5d p-6 text-center text-slate-400">No VIP keys forged yet.</div>`;
      document.getElementById("usersSection").innerHTML = usersHtml.length ? usersHtml.join("") : `<div class="card-5d p-6 text-center text-slate-400">No app users registered yet.</div>`;
    };
  </script>
</body>
</html>
